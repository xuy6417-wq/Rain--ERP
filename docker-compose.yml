services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: rain
      POSTGRES_USER: rain
      POSTGRES_PASSWORD: rain_dev_password
    ports: ["5432:5432"]
    volumes: [rain_pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rain -d rain"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  api:
    build: ./apps/api
    environment:
      DATABASE_URL: postgresql+psycopg://rain:rain_dev_password@postgres:5432/rain
    ports: ["8000:8000"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  rain_pg:
